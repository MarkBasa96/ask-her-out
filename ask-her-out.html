<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go On a Date With Me? 🌸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #1a0933 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image:
                radial-gradient(circle, #fff 1px, transparent 1px),
                radial-gradient(circle, #eee 0.5px, transparent 0.5px),
                radial-gradient(circle, #ddd 1.5px, transparent 1.5px);
            background-size:
                350px 350px,
                500px 500px,
                750px 750px;
            background-position:
                0 0,
                100px 100px,
                150px 50px;
            opacity: 0.5;
            animation: twinkle 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 80px rgba(236, 72, 153, 0.3), 0 0 40px rgba(147, 112, 219, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            animation: containerGlow 3s ease-in-out infinite;
        }

        @keyframes containerGlow {
            0%, 100% {
                box-shadow: 0 20px 80px rgba(236, 72, 153, 0.2), 0 0 40px rgba(147, 112, 219, 0.1);
            }
            50% {
                box-shadow: 0 20px 80px rgba(236, 72, 153, 0.35), 0 0 60px rgba(147, 112, 219, 0.25);
            }
        }

        h1 {
            color: #ec4899;
            font-size: 2rem;
            margin-bottom: 30px;
            line-height: 1.3;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(236, 72, 153, 0.3);
        }

        .photo-placeholder {
            width: 100%;
            height: 280px;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.15);
        }

        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            min-height: 60px;
            position: relative;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .yes-button {
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            color: white;
        }

        .yes-button:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.4);
        }

        .yes-button:active {
            transform: scale(0.98);
        }

        .no-button {
            background: linear-gradient(135deg, #cbd5e1 0%, #e2e8f0 100%);
            color: #475569;
        }

        .no-button.dodging {
            position: fixed;
        }

        .no-button:hover {
            background: linear-gradient(135deg, #94a3b8 0%, #cbd5e1 100%);
        }

        /* Hidden sections that show after "Yes" */
        .celebration-section {
            display: none;
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .celebration-section.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        .celebration-message {
            font-size: 1.5rem;
            color: #ec4899;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .date-picker-wrapper {
            margin: 20px 0;
        }

        .date-picker-wrapper label {
            display: block;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: left;
            font-size: 0.95rem;
        }

        .date-picker-wrapper input,
        .date-picker-wrapper textarea {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .date-picker-wrapper input:focus,
        .date-picker-wrapper textarea:focus {
            outline: none;
            border-color: #ec4899;
        }

        .date-picker-wrapper textarea {
            resize: vertical;
            min-height: 60px;
        }

        .confirm-button {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
            margin-top: 15px;
            width: 100%;
            display: none;
        }

        .confirm-button.show {
            display: block;
        }

        .confirm-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
        }

        /* Modal overlay for confirmation */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
            animation: fadeIn 0.5s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                backdrop-filter: blur(0px);
            }
            to {
                opacity: 1;
                backdrop-filter: blur(3px);
            }
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.99);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4), 0 0 50px rgba(236, 72, 153, 0.2);
            animation: modalSlideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-heading {
            font-size: 2rem;
            color: #ec4899;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .modal-text {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .celebration-photo {
            width: 100%;
            max-width: 200px;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.15);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-buttons button {
            flex: 1;
            min-width: 120px;
        }

        .close-modal-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }

        .close-modal-btn:hover {
            transform: scale(1.05);
        }

        /* "Pretty please" modal for No button click */
        .please-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
            animation: fadeIn 0.5s ease;
        }

        .please-modal.active {
            display: flex;
        }

        .please-content {
            background: rgba(255, 255, 255, 0.99);
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4), 0 0 50px rgba(236, 72, 153, 0.2);
            animation: modalSlideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }

        .please-photo {
            width: 100%;
            max-width: 250px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.15);
        }

        .please-button {
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            color: white;
            padding: 14px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.2);
            transition: all 0.3s ease;
        }

        .please-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.4);
        }

        .please-button:active {
            transform: scale(0.98);
        }

        /* Confetti animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        /* Floating hearts animation */
        .floating-heart {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 3s ease-out forwards;
        }

        @keyframes floatUp {
            to {
                opacity: 0;
                transform: translateY(-100px) rotate(20deg);
            }
        }

        /* Floating petals animation */
        .floating-petal {
            position: fixed;
            font-size: 1.5rem;
            pointer-events: none;
            animation: petal 4s ease-in forwards;
        }

        @keyframes petal {
            to {
                opacity: 0;
                transform: translateY(100px) rotate(360deg);
            }
        }

        /* Mute button for background music */
        .mute-button {
            background: transparent;
            border: 2px solid #ec4899;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50%;
            transition: all 0.2s ease;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mute-button:hover {
            transform: scale(1.1);
            background: rgba(236, 72, 153, 0.1);
        }

        .mute-button:active {
            transform: scale(0.95);
        }

        /* Hide YouTube player completely but keep it in DOM for API */
        #player {
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .celebration-message {
                font-size: 1.2rem;
            }

            .modal-content {
                padding: 30px 20px;
                max-width: 90vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will you go on a date with me? 🌸</h1>

        <div class="photo-placeholder">
            <img src="Pics/Pano Kung.jpg" alt="You">
        </div>

        <div class="buttons-container">
            <button class="yes-button" onclick="showDatePicker()">Yes</button>
            <button class="no-button" id="noButton" onclick="handleNoButtonClick()">No</button>
        </div>

        <!-- Celebration section with date picker -->
        <div class="celebration-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div class="celebration-message">Yay! 💕</div>
                <button id="muteButton" class="mute-button" onclick="toggleMute()" title="Toggle music">🔊</button>
            </div>

            <div class="date-picker-wrapper">
                <label for="date-input">When would you like to go out?</label>
                <input type="date" id="date-input" name="date" onchange="showConfirmButton()">
            </div>

            <div class="date-picker-wrapper">
                <label for="time-input">What time?</label>
                <input type="time" id="time-input" name="time" onchange="showConfirmButton()">
            </div>

            <div class="date-picker-wrapper">
                <label for="email-input">Your email</label>
                <input type="email" id="email-input" name="email" placeholder="your@email.com" onchange="showConfirmButton()">
            </div>

            <div class="date-picker-wrapper">
                <label for="message-input">Anything you'd like to say? 💌</label>
                <textarea id="message-input" name="message" placeholder="(optional)" onchange="showConfirmButton()"></textarea>
            </div>

            <button class="confirm-button" onclick="confirmDate()">Confirm Date</button>
        </div>
    </div>

    <!-- Modal overlay for final confirmation -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-heading">See you there! 💕</div>
            <div class="modal-text" id="confirmMessage"></div>
            <img src="Pics/Mingming.jpg" alt="Celebration" class="celebration-photo">
            <div class="modal-buttons">
                <button class="close-modal-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- "Pretty please" modal for when No button is clicked -->
    <div class="please-modal" id="pleaseModal">
        <div class="please-content">
            <img src="Pics/yes please.jpeg" alt="Pretty please!" class="please-photo">
            <button class="please-button" onclick="convertNoToYes()">Pretty please, yes? 🥺</button>
        </div>
    </div>

    <!-- Hidden YouTube player for background music -->
    <div id="player"></div>

    <script>
        // YouTube music player variables
        let player;
        let isMuted = false;
        let playerReady = false;

        // Load YouTube IFrame API
        console.log('Loading YouTube IFrame API...');
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // YouTube API ready callback
        function onYouTubeIframeAPIReady() {
            console.log('✓ YouTube API ready - creating player');
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'RgOIt-jOz-k',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
            console.log('✓ Player object created:', player);
        }

        function onPlayerReady(event) {
            console.log('✓ Player ready event fired');
            // Set volume to 50%
            event.target.setVolume(50);
            playerReady = true;
            console.log('✓ Player ready flag set to true, volume set to 50%');
        }

        function playMusic() {
            console.log('🎵 playMusic() called - playerReady:', playerReady, ', player exists:', !!player);
            if (playerReady && player && typeof player.playVideo === 'function') {
                console.log('🎵 Conditions met - calling player.playVideo()');
                player.playVideo();
                console.log('🎵 playVideo() executed');
            } else {
                console.log('⚠ Cannot play: playerReady=' + playerReady + ', player=' + (player ? 'exists' : 'null') + ', playVideo=' + (player && typeof player.playVideo));
            }
        }

        function toggleMute() {
            if (player) {
                if (isMuted) {
                    player.unMute();
                    document.getElementById('muteButton').textContent = '🔊';
                    isMuted = false;
                } else {
                    player.mute();
                    document.getElementById('muteButton').textContent = '🔇';
                    isMuted = true;
                }
            }
        }

        // Store original button position and dodge radius
        let originalButtonX = 0;
        let originalButtonY = 0;
        const DODGE_RADIUS = 100; // pixels - button can only move max 100px from start

        // Initialize button's original position when page loads
        function initializeButtonPosition() {
            const noButton = document.querySelector('.no-button');
            if (noButton) {
                const rect = noButton.getBoundingClientRect();
                originalButtonX = rect.left;
                originalButtonY = rect.top;
            }
        }

        function dodgeButton(button) {
            button.classList.add('dodging');

            // Generate random offset within the dodge radius
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * DODGE_RADIUS;

            let newX = originalButtonX + Math.cos(angle) * distance;
            let newY = originalButtonY + Math.sin(angle) * distance;

            console.log('🎯 DODGE #1 - Before clamping: newX=' + newX.toFixed(1) + ', newY=' + newY.toFixed(1));

            // ===== CLAMPING LOGIC #1: Radius constraint (100px from original position) =====
            // Ensure button stays within 100px radius of where it started
            newX = Math.max(originalButtonX - DODGE_RADIUS, Math.min(originalButtonX + DODGE_RADIUS, newX));
            newY = Math.max(originalButtonY - DODGE_RADIUS, Math.min(originalButtonY + DODGE_RADIUS, newY));

            console.log('🎯 DODGE #2 - After radius clamping: newX=' + newX.toFixed(1) + ', newY=' + newY.toFixed(1) + ' (radius: [' + (originalButtonX - DODGE_RADIUS).toFixed(1) + '-' + (originalButtonX + DODGE_RADIUS).toFixed(1) + '])');

            // ===== CLAMPING LOGIC #2: Viewport bounds constraint =====
            // ALSO ensure button never goes off-screen, even if original position is near edges
            // Left edge: ensure x >= 0
            // Right edge: ensure x + button width <= window width
            // Top edge: ensure y >= 0
            // Bottom edge: ensure y + button height <= window height
            newX = Math.max(0, Math.min(window.innerWidth - button.offsetWidth, newX));
            newY = Math.max(0, Math.min(window.innerHeight - button.offsetHeight, newY));

            console.log('🎯 DODGE #3 - After viewport clamping: newX=' + newX.toFixed(1) + ', newY=' + newY.toFixed(1) + ' (viewport: [0-' + (window.innerWidth - button.offsetWidth).toFixed(1) + '], window size: ' + window.innerWidth + 'x' + window.innerHeight + ')');

            button.style.left = newX + 'px';
            button.style.top = newY + 'px';

            // Wiggle animation on each dodge
            button.style.animation = 'none';
            setTimeout(() => {
                button.style.animation = '';
            }, 10);
        }

        // Flag to control dodging behavior
        let shouldDodge = true;

        // Initialize position on page load and on window resize
        window.addEventListener('load', initializeButtonPosition);
        window.addEventListener('resize', initializeButtonPosition);
        initializeButtonPosition();

        // Debug logging
        console.log('Initial button position captured. originalButtonX:', originalButtonX, 'originalButtonY:', originalButtonY);

        // Handle No button click - shows the "pretty please" modal
        function handleNoButtonClick() {
            document.getElementById('pleaseModal').classList.add('active');
        }

        // Convert No button to Yes button after "pretty please" is clicked
        function convertNoToYes() {
            // Close the modal
            document.getElementById('pleaseModal').classList.remove('active');

            // Disable dodging behavior
            shouldDodge = false;

            // Change the No button to Yes
            const noButton = document.getElementById('noButton');
            noButton.textContent = 'Yes';
            noButton.classList.remove('no-button');
            noButton.classList.add('yes-button');
            noButton.onclick = function() { showDatePicker(); };
        }

        // Proximity detection for dodging - active from the start
        // TRIGGER DISTANCE: 50 pixels - button jumps instantly when cursor gets this close
        const PROXIMITY_TRIGGER = 50; // pixels - small enough to dodge before cursor reaches button

        document.addEventListener('mousemove', (e) => {
            if (!shouldDodge) return; // Skip if button has been converted to Yes

            const noButton = document.querySelector('.no-button');
            if (!noButton) return;

            const buttonRect = noButton.getBoundingClientRect();
            const buttonCenterX = buttonRect.left + buttonRect.width / 2;
            const buttonCenterY = buttonRect.top + buttonRect.height / 2;

            // Calculate distance from cursor to button center
            const distance = Math.sqrt(
                Math.pow(e.clientX - buttonCenterX, 2) +
                Math.pow(e.clientY - buttonCenterY, 2)
            );

            // Instant dodge reaction when cursor gets within 50px
            if (distance < PROXIMITY_TRIGGER) {
                dodgeButton(noButton);
            }
        });

        function showDatePicker() {
            document.querySelector('.celebration-section').classList.add('active');
            document.querySelector('.buttons-container').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.querySelector('.photo-placeholder').style.display = 'none';

            // Trigger celebration effects
            triggerConfetti();
            triggerFloatingHearts();
            triggerFloatingPetals();

            // Start background music
            playMusic();
        }

        function showConfirmButton() {
            const dateInput = document.getElementById('date-input').value;
            const timeInput = document.getElementById('time-input').value;
            const emailInput = document.getElementById('email-input').value;

            if (dateInput && timeInput && emailInput) {
                document.querySelector('.confirm-button').classList.add('show');
            } else {
                document.querySelector('.confirm-button').classList.remove('show');
            }
        }

        function confirmDate() {
            const dateInput = document.getElementById('date-input').value;
            const timeInput = document.getElementById('time-input').value;
            const emailInput = document.getElementById('email-input').value;
            const messageInput = document.getElementById('message-input').value;

            const dateObj = new Date(dateInput);
            const formattedDate = dateObj.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const [hours, minutes] = timeInput.split(':');
            const formattedTime = new Date(`2000-01-01T${timeInput}`).toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                meridiem: 'short'
            });

            document.getElementById('confirmMessage').textContent = `I can't wait to see you on ${formattedDate} at ${formattedTime}! 😊`;

            // Show modal
            document.getElementById('modal').classList.add('active');

            // Send confirmation email in background (using fetch, no redirect)
            sendEmailConfirmation(dateInput, timeInput, emailInput, messageInput);

            // Add to Google Calendar with time and guest email
            addToGoogleCalendar(dateInput, timeInput);
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function sendEmailConfirmation(selectedDate, selectedTime, emailInput, messageInput) {
            const formData = new FormData();
            formData.append('date', selectedDate);
            formData.append('time', selectedTime);
            formData.append('email', emailInput);
            formData.append('message', messageInput || '(no message)');

            fetch('https://formspree.io/f/xoeqarab', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                console.log('Confirmation email sent successfully');
            })
            .catch(error => {
                console.error('Error sending email:', error);
            });
        }

        function addToGoogleCalendar(selectedDate, selectedTime) {
            const eventTitle = 'Our Date';
            const eventDescription = 'A special date!';

            // Format: YYYYMMDDTHHMMSS
            const startDateTime = new Date(selectedDate + 'T' + selectedTime).toISOString().split('.')[0].replace(/[-:]/g, '');

            // 1 hour duration
            const endDateTime = new Date(new Date(selectedDate + 'T' + selectedTime).getTime() + 3600000).toISOString().split('.')[0].replace(/[-:]/g, '');

            const calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(eventTitle)}&dates=${startDateTime}/${endDateTime}&details=${encodeURIComponent(eventDescription)}&add=${encodeURIComponent('joemarkloarbasa96@gmail.com')}`;

            // Open Google Calendar in a new tab
            window.open(calendarUrl, '_blank');
        }

        function triggerConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = Math.random() * window.innerHeight + 'px';
                confetti.style.background = ['#ec4899', '#f472b6', '#fbcfe8', '#fce7f3'][Math.floor(Math.random() * 4)];
                confetti.style.animation = `fall ${2 + Math.random() * 2}s linear forwards`;

                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function triggerFloatingHearts() {
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '💕';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.top = window.innerHeight + 'px';

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }

        function triggerFloatingPetals() {
            for (let i = 0; i < 20; i++) {
                const petal = document.createElement('div');
                petal.className = 'floating-petal';
                petal.innerHTML = '🌸';
                petal.style.left = Math.random() * window.innerWidth + 'px';
                petal.style.top = '-20px';

                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 4000);
            }
        }

        // Add CSS for confetti fall animation and shooting stars
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(360deg);
                    opacity: 0;
                }
            }
            @keyframes shootingStar {
                0% {
                    transform: translateX(0) translateY(0);
                    opacity: 1;
                }
                100% {
                    transform: translateX(600px) translateY(-600px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Create occasional shooting stars
        function createShootingStar() {
            if (Math.random() > 0.7) {
                const star = document.createElement('div');
                star.style.position = 'fixed';
                star.style.width = '2px';
                star.style.height = '2px';
                star.style.background = 'white';
                star.style.left = Math.random() * window.innerWidth + 'px';
                star.style.top = Math.random() * window.innerHeight * 0.3 + 'px';
                star.style.boxShadow = '0 0 10px rgba(255, 255, 255, 0.8)';
                star.style.animation = 'shootingStar 2s ease-out forwards';
                star.style.pointerEvents = 'none';
                star.style.zIndex = '2';
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 2000);
            }
        }

        // Trigger shooting stars occasionally
        setInterval(createShootingStar, 3000);
    </script>
</body>
</html>
