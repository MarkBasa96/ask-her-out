<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go On a Date With Me? ðŸ’•</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(236, 72, 153, 0.15);
            text-align: center;
        }

        h1 {
            color: #ec4899;
            font-size: 2rem;
            margin-bottom: 30px;
            line-height: 1.3;
            font-weight: 600;
        }

        .photo-placeholder {
            width: 100%;
            height: 280px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.15);
        }

        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .celebration-photo {
            width: 100%;
            max-width: 250px;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.15);
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            min-height: 60px;
            position: relative;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .yes-button {
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            color: white;
        }

        .yes-button:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.4);
        }

        .yes-button:active {
            transform: scale(0.98);
        }

        .no-button {
            background: linear-gradient(135deg, #cbd5e1 0%, #e2e8f0 100%);
            color: #475569;
        }

        .no-button.dodging {
            position: fixed;
        }

        .no-button:hover {
            background: linear-gradient(135deg, #94a3b8 0%, #cbd5e1 100%);
        }

        /* Hidden sections that show after "Yes" */
        .celebration-section {
            display: none;
            animation: slideIn 0.6s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .celebration-message {
            font-size: 1.5rem;
            color: #ec4899;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .date-picker-wrapper {
            margin: 25px 0;
        }

        .date-picker-wrapper label {
            display: block;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .date-picker-wrapper input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #f472b6;
            border-radius: 12px;
            color: #1f2937;
            background: #faf5ff;
        }

        .date-picker-wrapper input:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
        }

        /* Teddy bear */
        .teddy-bear {
            font-size: 5rem;
            margin: 30px 0;
            display: inline-block;
            animation: bearWave 0.6s ease-in-out;
        }

        @keyframes bearWave {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(-5deg) scale(1.05);
            }
            75% {
                transform: rotate(5deg) scale(1.05);
            }
        }

        .heart-float {
            position: fixed;
            pointer-events: none;
            animation: floatHeart 3s ease-out forwards;
            font-size: 1.5rem;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--drift)) scale(0);
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(var(--drift)) rotate(var(--rotation)) scale(0);
                opacity: 0;
            }
        }

        .petal {
            position: fixed;
            pointer-events: none;
            animation: petalFall 4s ease-in forwards;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(var(--drift)) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                border-radius: 25px;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .photo-placeholder {
                height: 200px;
                margin-bottom: 20px;
                font-size: 2.5rem;
            }

            .buttons-container {
                margin-bottom: 20px;
                min-height: 50px;
            }

            button {
                padding: 12px 24px;
                font-size: 1rem;
            }

            .teddy-bear {
                font-size: 4rem;
            }
        }
    </style>
</head>

        const noButton = document.querySelector('.no-button');
        const celebrationSection = document.querySelector('.celebration-section');
        const buttonsContainer = document.querySelector('.buttons-container');

        let isDodging = false;

        // Dodge button setup: Randomize position
        function randomizeNoButtonPosition() {
            const maxX = window.innerWidth - noButton.offsetWidth - 20;
            const maxY = window.innerHeight - noButton.offsetHeight - 20;

            noButton.style.left = Math.random() * maxX + 'px';
            noButton.style.top = Math.random() * maxY + 'px';
        }

        // Proximity detection for dodge mechanic
        const DODGE_DISTANCE = 80; // pixels

        document.addEventListener('mousemove', (e) => {
            if (celebrationSection.style.display === 'block') return; // Don't dodge after "Yes"

            const rect = noButton.getBoundingClientRect();
            const buttonCenterX = rect.left + rect.width / 2;
            const buttonCenterY = rect.top + rect.height / 2;

            const distance = Math.sqrt(
                Math.pow(e.clientX - buttonCenterX, 2) +
                Math.pow(e.clientY - buttonCenterY, 2)
            );

            // If cursor gets close, start dodging!
            if (distance < DODGE_DISTANCE) {
                if (!isDodging) {
                    isDodging = true;
                    noButton.classList.add('dodging');
                    randomizeNoButtonPosition();
                }
                // Keep dodging
                randomizeNoButtonPosition();
                // Add a little wiggle animation
                noButton.style.animation = 'none';
                setTimeout(() => {
                    noButton.style.animation = 'bearWave 0.3s ease-in-out';
                }, 10);
            }
        });

        // Touch support for mobile
        document.addEventListener('touchmove', (e) => {
            if (celebrationSection.style.display === 'block') return;

            const touch = e.touches[0];
            const rect = noButton.getBoundingClientRect();
            const buttonCenterX = rect.left + rect.width / 2;
            const buttonCenterY = rect.top + rect.height / 2;

            const distance = Math.sqrt(
                Math.pow(touch.clientX - buttonCenterX, 2) +
                Math.pow(touch.clientY - buttonCenterY, 2)
            );

            if (distance < DODGE_DISTANCE) {
                if (!isDodging) {
                    isDodging = true;
                    noButton.classList.add('dodging');
                    randomizeNoButtonPosition();
                }
                randomizeNoButtonPosition();
                noButton.style.animation = 'none';
                setTimeout(() => {
                    noButton.style.animation = 'bearWave 0.3s ease-in-out';
                }, 10);
            }
        });

        // Yes button click handler
        yesButton.addEventListener('click', () => {
            // Hide buttons, show celebration
            buttonsContainer.style.display = 'none';
            celebrationSection.style.display = 'block';

            // Trigger celebration effects
            triggerConfetti();
            triggerFloatingPetals();
            triggerHearts();
        });

        // Confetti animation
        function triggerConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.textContent = ['ðŸŽ‰', 'âœ¨', 'ðŸ’•', 'ðŸŽŠ'][Math.floor(Math.random() * 4)];
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-20px';
                confetti.style.setProperty('--drift', (Math.random() - 0.5) * 200 + 'px');
                confetti.style.setProperty('--rotation', Math.random() * 360 + 'deg');
                confetti.style.fontSize = (0.8 + Math.random() * 0.6) + 'rem';

                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Floating petals
        function triggerFloatingPetals() {
            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.textContent = 'ðŸŒ¸';
                petal.style.left = Math.random() * window.innerWidth + 'px';
                petal.style.setProperty('--drift', (Math.random() - 0.5) * 150 + 'px');
                petal.style.fontSize = (1.2 + Math.random() * 0.8) + 'rem';
                petal.style.animationDelay = Math.random() * 0.5 + 's';

                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 4500);
            }
        }

        // Floating hearts
        function triggerHearts() {
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.textContent = 'ðŸ’•';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.top = window.innerHeight / 2 + 'px';
                heart.style.setProperty('--drift', (Math.random() - 0.5) * 200 + 'px');
                heart.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
                heart.style.animationDelay = Math.random() * 0.3 + 's';

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3300);
            }
        }

        // Handle window resize to keep "No" button in bounds if dodging
        window.addEventListener('resize', () => {
            if (isDodging) {
                randomizeNoButtonPosition();
            }
        });
    </script>
</body>
</html>
