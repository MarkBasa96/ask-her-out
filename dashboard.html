<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Date Pages 🌅</title>
    <meta name="theme-color" content="#06060b">
    <meta name="robots" content="noindex">
    <link rel="icon" href="Pics/icon.svg" type="image/svg+xml">
    <link rel="icon" href="Pics/icon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="Pics/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
    <style>
        .tabs { display: flex; gap: 8px; margin-top: 22px; }
        .tabs button { padding: 8px 14px; border-radius: 99px; font-size: .86rem; cursor: pointer; border: 1px solid var(--line); background: var(--glass); }
        .tabs button[aria-selected="true"] { background: #f5f2ef; color: #16131a; font-weight: 600; border-color: transparent; }

        .grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 22px; margin-top: 22px; align-items: start; }
        .pages { padding: 10px; display: grid; gap: 8px; }
        .pcard { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; border: 1px solid transparent; background: none; text-align: left; cursor: pointer; width: 100%; }
        .pcard:hover { background: rgba(255, 255, 255, .04); }
        .pcard[aria-current="true"] { background: rgba(255, 90, 95, .1); border-color: rgba(255, 120, 95, .5); box-shadow: inset 0 0 22px rgba(255, 90, 95, .12); }
        .pcard .pic { width: 48px; height: 58px; border-radius: 12px; flex: none; background: rgba(255, 255, 255, .06) center / cover no-repeat; display: grid; place-items: center; font-size: 1.3rem; }
        .pcard .pic.has { font-size: 0; }
        .pcard .t { font-weight: 600; font-size: .94rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pcard .u { font-size: .74rem; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pcard > div { min-width: 0; }
        .pcard .c { margin-left: auto; flex: none; }
        .count { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 99px; background: var(--sun); display: grid; place-items: center; font-size: .78rem; font-weight: 700; box-shadow: 0 0 14px -2px rgba(255, 90, 95, .8); }
        .new { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 18px; border: 1.5px dashed rgba(255, 255, 255, .16); color: var(--muted); font-size: .88rem; text-decoration: none; }
        .new:hover { color: #fff; border-color: rgba(255, 160, 130, .5); }
        .new.off { pointer-events: none; opacity: .5; }
        .quota { padding: 4px 12px 8px; font-size: .74rem; color: var(--muted); }
        .bar { height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .08); margin-top: 6px; overflow: hidden; }
        .bar i { display: block; height: 100%; background: var(--sun); }

        .detail { padding: 20px; min-width: 0; }
        .dtop { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
        .dtop h2 { font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 1.5rem; letter-spacing: -.02em; min-width: 0; overflow-wrap: anywhere; }
        .linkbox { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 6px 6px 14px; border-radius: 13px; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); font-size: .88rem; }
        .linkbox span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ffd0b8; }
        .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .danger { color: #ffb0a0 !important; }
        .sec { font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 1.05rem; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
        .pill.hidden-pill { background: rgba(255, 176, 160, .12); border-color: rgba(255, 176, 160, .45); color: #ffb0a0; }

        .ticket { border-radius: 18px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .13); background: rgba(255, 255, 255, .04); margin-bottom: 10px; }
        .thead { display: flex; gap: 12px; align-items: center; padding: 12px 14px;
            background: radial-gradient(120% 140% at 0% 0%, rgba(255, 122, 47, .3), transparent 60%), radial-gradient(100% 140% at 100% 100%, rgba(255, 61, 139, .26), transparent 60%); }
        .thead .admit { font-size: .58rem; letter-spacing: .22em; font-weight: 700; color: #ffc2a6; }
        .thead h3 { font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 1.15rem; }
        .thead .when { margin-left: auto; font-size: .72rem; color: var(--muted); text-align: right; flex: none; }
        .perf { border-top: 1.5px dashed rgba(255, 255, 255, .18); margin: 0 12px; }
        .tgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 12px 14px; }
        .tgrid small { display: block; font-size: .56rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
        .tgrid b { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
        .note { grid-column: 1 / -1; font-family: 'Caveat', cursive; font-size: 1.25rem; color: #ffd7c8; line-height: 1.2; overflow-wrap: anywhere; }
        .tfoot { display: flex; gap: 8px; padding: 0 14px 12px; flex-wrap: wrap; }
        .ticket.seen { opacity: .78; }
        .ticket.old { opacity: .5; }
        .ticket.old h3 { text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .45); }

        .empty { padding: 26px 22px; text-align: center; }
        .empty .sticker { width: 150px; height: 148px; margin: 0 auto 14px; transform: rotate(3deg); }
        .empty h2 { font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 1.5rem; }
        .empty p { color: var(--muted); font-size: .9rem; margin: 6px 0 16px; }
        .quiet { color: var(--muted); font-size: .88rem; padding: 6px 2px; }

        .reports { padding: 18px; margin-top: 22px; }
        .reports .sec:first-child { margin-top: 0; }
        .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
        .stat { border-radius: 14px; padding: 11px 13px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
        .stat small { display: block; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
        .stat b { font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 1.45rem; }
        .all-search { margin-top: 12px; }
        .all-list { display: grid; gap: 8px; margin-top: 10px; }
        .all-row { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); }
        .all-row.is-hidden { opacity: .6; }
        .all-row .pic { width: 44px; height: 54px; border-radius: 11px; flex: none; background: rgba(255, 255, 255, .06) center / cover no-repeat; display: grid; place-items: center; font-size: 1.2rem; }
        .all-row .pic.has { font-size: 0; }
        .all-row .info { min-width: 0; flex: 1; }
        .all-row .t { font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .all-row .h { font-size: .84rem; color: #dcd6e2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
        .all-row .u { font-size: .74rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .all-row .acts { margin-top: 0; flex: none; }
        @media (max-width: 860px) {
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .all-row { flex-wrap: wrap; }
            .all-row .acts { width: 100%; }
        }
        .report { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); margin-top: 10px; }
        .report.resolved { opacity: .6; }
        .report .r-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .86rem; }
        .report .r-head a { color: #ffd0b8; }
        .report p { margin: 8px 0; font-size: .9rem; color: #dcd6e2; overflow-wrap: anywhere; }

        @media (max-width: 860px) {
            .grid { grid-template-columns: minmax(0, 1fr); }
            .tgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="nebula" aria-hidden="true"><i></i><i></i></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="arc" aria-hidden="true"></div>

    <header class="nav">
        <a class="logo" href="create.html" style="text-decoration:none"><img class="logo-mark" src="Pics/icon.svg" alt="" width="26" height="26">DATE PAGE<i></i></a>
        <nav class="nav-links"><a href="create.html">Create</a><a class="on" href="dashboard.html" aria-current="page">My pages</a></nav>
        <div class="nav-right"></div>
    </header>

    <div class="wrap">
        <span class="kicker">Dashboard</span>
        <h1>Your <span>date pages</span></h1>
        <p class="lead">Every yes lands here the moment they lock it in.</p>
        <div id="app"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="site.js"></script>
    <script>
    (async () => {
        const app = $('#app');
        const user = await currentUser();
        if (!user) {
            renderSignIn(app, { title: 'Sign in to see your pages', text: 'Enter your email and we\'ll send you a magic link. No password.' });
            return;
        }
        renderUser(user);
        $('.nav-right').insertAdjacentHTML('afterbegin', '<a class="btn btn-sun btn-small" href="create.html">+ New page</a>');

        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
        const PLAN_ICON = plan => (plan.match(/\p{Extended_Pictographic}/u) || ['💕'])[0];
        const planName = plan => plan.replace(/\s*\p{Extended_Pictographic}️?\s*/gu, ' ').trim();

        let pages = [], answers = [], selected = null;
        const isAdmin = (await sb.rpc('is_admin')).data === true;

        async function load() {
            const [p, a] = await Promise.all([
                sb.from('pages').select('*').eq('owner_id', user.id).order('created_at', { ascending: false }),
                sb.from('answers').select('*').order('created_at', { ascending: false })
            ]);
            if (p.error || a.error) { app.innerHTML = ''; app.append(el('p', 'quiet err', 'Couldn\'t load your pages. Refresh to try again.')); return; }
            pages = p.data;
            answers = a.data;
            if (!pages.some(pg => pg.id === selected)) selected = pages[0]?.id || null;
            render();
        }

        function render() {
            app.innerHTML = '';
            if (isAdmin) {
                const tabs = el('div', 'tabs');
                tabs.setAttribute('role', 'tablist');
                tabs.innerHTML = '<button type="button" role="tab" aria-selected="true" data-tab="pages">My pages</button><button type="button" role="tab" aria-selected="false" data-tab="admin">Admin</button>';
                tabs.addEventListener('click', e => {
                    const b = e.target.closest('[data-tab]');
                    if (!b) return;
                    tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
                    $('#pagesView').classList.toggle('hidden', b.dataset.tab !== 'pages');
                    $('#adminView').classList.toggle('hidden', b.dataset.tab !== 'admin');
                    if (b.dataset.tab === 'admin') renderAdmin();
                });
                app.append(tabs);
            }
            const view = el('div');
            view.id = 'pagesView';
            app.append(view);
            if (isAdmin) { const av = el('div', 'hidden'); av.id = 'adminView'; app.append(av); }

            if (!pages.length) {
                view.innerHTML = `<div class="glass empty" style="max-width:520px;margin:26px auto 0">
                    <img class="sticker" src="Pics/cat-kiss.jpg" alt="Two cats, one kissing the other on the cheek" width="235" height="232">
                    <h2>No pages yet</h2><p>Make one in a couple of minutes, then send them the link.</p>
                    <a class="btn btn-sun" href="create.html">Make my first page →</a></div>`;
                return;
            }

            const grid = el('div', 'grid');
            const list = el('div', 'glass pages');
            for (const pg of pages) {
                const b = el('button', 'pcard');
                b.type = 'button';
                b.setAttribute('aria-current', String(pg.id === selected));
                const pic = el('span', 'pic' + (pg.photo_path ? ' has' : ''), '💌');
                if (pg.photo_path) pic.style.backgroundImage = `url("${photoUrl(pg.photo_path)}")`;
                const txt = el('div');
                txt.append(el('div', 't', pg.sender_name + (pg.pet_name ? ` → ${pg.pet_name}` : '')), el('div', 'u', '/p/' + pg.slug));
                const unseen = answers.filter(a => a.page_id === pg.id && !a.seen_at).length;
                const total = answers.filter(a => a.page_id === pg.id).length;
                const c = el('div', 'c');
                if (pg.hidden) c.append(el('span', 'pill hidden-pill', 'Hidden'));
                else if (unseen) c.append(el('span', 'count', String(unseen)));
                else c.append(el('span', 'pill', total ? `${total} answer${total > 1 ? 's' : ''}` : 'No answer yet'));
                b.append(pic, txt, c);
                b.addEventListener('click', () => { selected = pg.id; render(); });
                list.append(b);
            }
            const more = el('a', 'new' + (pages.length >= PAGE_LIMIT ? ' off' : ''), pages.length >= PAGE_LIMIT ? 'Page limit reached' : '+ Make another page');
            more.href = 'create.html';
            const quota = el('div', 'quota', `${pages.length} of ${PAGE_LIMIT} pages used`);
            const bar = el('div', 'bar'), fill = el('i');
            fill.style.width = Math.min(100, pages.length / PAGE_LIMIT * 100) + '%';
            bar.append(fill);
            quota.append(bar);
            list.append(more, quota);

            grid.append(list, renderDetail(pages.find(pg => pg.id === selected)));
            view.append(grid);
        }

        function renderDetail(pg) {
            const box = el('div', 'glass detail');
            const link = pageLink(pg.slug);
            const top = el('div', 'dtop');
            const status = pg.hidden ? el('span', 'pill hidden-pill', 'Hidden by an admin') : el('span', 'pill live', 'Live');
            if (!pg.hidden) status.prepend(el('i'));
            top.append(el('h2', null, pg.headline), status);

            const lb = el('div', 'linkbox');
            const copy = el('button', 'btn btn-sun btn-small', 'Copy link');
            copy.type = 'button';
            copy.addEventListener('click', () => copyText(link));
            lb.append(el('span', null, link.replace(/^https?:\/\//, '')), copy);

            const acts = el('div', 'acts');
            const edit = el('a', 'btn btn-glass btn-small', 'Edit');
            edit.href = 'create.html?edit=' + pg.id;
            const open = el('a', 'btn btn-glass btn-small', 'Open ↗');
            open.href = link; open.target = '_blank'; open.rel = 'noopener';
            acts.append(edit, open);
            if (navigator.share) {
                const share = el('button', 'btn btn-glass btn-small', 'Share…');
                share.type = 'button';
                share.addEventListener('click', () => navigator.share({ title: pg.headline, url: link }).catch(() => {}));
                acts.append(share);
            }
            const del = el('button', 'btn btn-glass btn-small danger', 'Delete');
            del.type = 'button';
            del.addEventListener('click', async () => {
                if (!confirm(`Delete /p/${pg.slug} and all its answers? This can't be undone.`)) return;
                const { error } = await sb.from('pages').delete().eq('id', pg.id);
                if (error) return toast(friendlyError(error));
                const paths = pg.photo_paths && pg.photo_paths.length ? pg.photo_paths : pg.photo_path ? [pg.photo_path] : [];
                if (paths.length) await sb.storage.from('photos').remove(paths);
                toast('Page deleted');
                selected = null;
                load();
            });
            acts.append(del);

            const mine = answers.filter(a => a.page_id === pg.id);
            const unseen = mine.filter(a => !a.seen_at).length;
            const sec = el('div', 'sec', 'Answers');
            if (unseen) sec.append(el('span', 'pill hot', `${unseen} new`));
            box.append(top, lb, acts, sec);

            if (!mine.length) box.append(el('p', 'quiet', 'No answer yet. Send them the link! 💌'));
            // A changed date points at the one it replaced; the old one stays, dimmed, below the new one
            const replaced = new Set(mine.map(a => a.replaces).filter(Boolean));
            mine.forEach((a, i) => {
                const earlier = mine.slice(i + 1).some(b => b.email === a.email);
                const kind = replaced.has(a.id) ? 'old' : a.replaces ? 'changed' : earlier ? 'another' : null;
                box.append(ticket(a, i === 0 && !a.seen_at, pg, kind));
            });

            // Mark them seen once they've been shown
            if (unseen) {
                const ids = mine.filter(a => !a.seen_at).map(a => a.id);
                sb.from('answers').update({ seen_at: new Date().toISOString() }).in('id', ids).then(({ error }) => {
                    if (!error) answers.forEach(a => { if (ids.includes(a.id)) a._seenNow = true; });
                });
            }
            return box;
        }

        // Times: starts_at is the real moment (UTC). Show it in the timezone they picked it in.
        function ticket(a, newest, pg, kind) {
            const t = el('div', 'ticket' + (a.seen_at ? ' seen' : '') + (kind === 'old' ? ' old' : ''));
            const start = a.starts_at ? new Date(a.starts_at) : null;
            const tz = a.timezone || undefined;
            const fmt = (opts) => { try { return start.toLocaleString('en-US', { ...opts, timeZone: tz }); } catch { return start.toLocaleString('en-US', opts); } };
            const day = start ? fmt({ weekday: 'short', month: 'short', day: 'numeric' }) : a.day;
            const time = start ? fmt({ hour: 'numeric', minute: '2-digit' }) : a.time;
            const received = new Date(a.created_at);
            const today = received.toDateString() === new Date().toDateString();

            const head = el('div', 'thead'), left = el('div');
            const admit = kind === 'old' ? 'OLD PLAN · THEY CHANGED IT' : kind === 'changed' ? 'ADMIT TWO · NEW PLAN' : kind === 'another' ? 'ADMIT TWO · ANOTHER DATE'
                : newest ? 'ADMIT TWO · THEY SAID YES' : 'ADMIT TWO';
            left.append(el('div', 'admit', admit), el('h3', null, `${PLAN_ICON(a.plan)} ${planName(a.plan)}`));
            const when = el('div', 'when');
            when.append('received', el('br'), today ? 'today, ' + received.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : received.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
            head.append(left, when);

            const grid = el('div', 'tgrid');
            for (const [k, v] of [['Day', day], ['Time', time], ['Their email', a.email], ['Timezone', a.timezone || '—']]) {
                const d = el('div');
                d.append(el('small', null, k), el('b', null, v));
                grid.append(d);
            }
            if (a.note) grid.append(el('p', 'note', `“${a.note}”`));

            t.append(head, el('div', 'perf'), grid);
            if (start && kind !== 'old') {
                const foot = el('div', 'tfoot');
                const end = new Date(start.getTime() + 2 * 3600000);
                // Real UTC stamps that keep the Z, so Google puts it at the right moment wherever you are
                const utc = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const params = new URLSearchParams({ action: 'TEMPLATE', text: `Our Date 💕 (${a.plan})`, dates: `${utc(start)}/${utc(end)}`, details: a.note ? `“${a.note}”` : 'A special date!', add: a.email });
                const g = el('a', 'btn btn-glass btn-small', '📅 Add to Google Calendar');
                g.href = 'https://calendar.google.com/calendar/render?' + params;
                g.target = '_blank'; g.rel = 'noopener';
                const ics = el('button', 'btn btn-glass btn-small', '⬇ .ics');
                ics.type = 'button';
                ics.addEventListener('click', () => {
                    const esc = s => s.replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
                    const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Date Page//EN', 'BEGIN:VEVENT', `UID:${a.id}@date-page`, `DTSTAMP:${utc(new Date())}`,
                        `DTSTART:${utc(start)}`, `DTEND:${utc(end)}`, `SUMMARY:${esc(`Our Date 💕 (${a.plan})`)}`,
                        `DESCRIPTION:${esc(a.note ? `“${a.note}”` : 'A special date!')}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' }));
                    link.download = 'our-date.ics';
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                });
                foot.append(g, ics);
                t.append(foot);
            }
            return t;
        }

        // ----- Admin (Mark only): every page on the site, reported pages, hide/unhide -----
        // Admins can see every page (RLS allows it), but never other people's answers.
        function hideButton(pg) {
            const b = el('button', 'btn btn-glass btn-small' + (pg.hidden ? '' : ' danger'), pg.hidden ? 'Unhide page' : 'Hide page');
            b.type = 'button';
            b.addEventListener('click', async () => {
                if (!pg.hidden && !confirm(`Hide /p/${pg.slug}? Nobody will be able to open it until you unhide it.`)) return;
                const { error } = await sb.from('pages').update({ hidden: !pg.hidden }).eq('id', pg.id);
                if (error) return toast(friendlyError(error));
                toast(pg.hidden ? 'Page is visible again' : 'Page hidden');
                renderAdmin();
            });
            return b;
        }

        async function renderAllPages(box) {
            box.append(el('div', 'sec', 'All pages'));
            const { data: all, error } = await sb.from('pages').select('id,slug,owner_id,sender_name,pet_name,headline,photo_path,hidden,created_at').order('created_at', { ascending: false }).limit(1000);
            if (error) return box.append(el('p', 'quiet err', friendlyError(error)));
            const weekAgo = Date.now() - 7 * 864e5;
            const stats = el('div', 'stats');
            for (const [k, v] of [['Pages', all.length], ['Made this week', all.filter(p => new Date(p.created_at) > weekAgo).length],
                                  ['Creators', new Set(all.map(p => p.owner_id)).size], ['Hidden', all.filter(p => p.hidden).length]]) {
                const st = el('div', 'stat');
                st.append(el('small', null, k), el('b', null, String(v)));
                stats.append(st);
            }
            box.append(stats);
            if (!all.length) return box.append(el('p', 'quiet', 'Nobody has made a page yet. They\'ll show up here as soon as someone does. 🌅'));

            const search = el('input', 'field all-search');
            search.type = 'search';
            search.placeholder = 'Search by name, headline or link…';
            search.setAttribute('aria-label', 'Search all pages');
            const list = el('div', 'all-list');
            box.append(search, list);
            const draw = () => {
                const q = search.value.trim().toLowerCase();
                list.innerHTML = '';
                const shown = all.filter(p => !q || [p.sender_name, p.pet_name, p.headline, p.slug].some(v => (v || '').toLowerCase().includes(q)));
                if (!shown.length) list.append(el('p', 'quiet', 'No pages match that.'));
                for (const pg of shown) {
                    const row = el('div', 'all-row' + (pg.hidden ? ' is-hidden' : ''));
                    const pic = el('span', 'pic' + (pg.photo_path ? ' has' : ''), '💌');
                    if (pg.photo_path) pic.style.backgroundImage = `url("${photoUrl(pg.photo_path)}")`;
                    const info = el('div', 'info');
                    const u = el('div', 'u');
                    u.append(el('span', null, '/p/' + pg.slug), el('span', null, new Date(pg.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })));
                    if (pg.hidden) u.append(el('span', 'pill hidden-pill', 'Hidden'));
                    if (pg.owner_id === user.id) u.append(el('span', 'pill', 'Yours'));
                    info.append(el('div', 't', pg.sender_name + (pg.pet_name ? ` → ${pg.pet_name}` : '')), el('div', 'h', pg.headline), u);
                    const acts = el('div', 'acts');
                    const open = el('a', 'btn btn-glass btn-small', 'Open ↗');
                    open.href = pageLink(pg.slug); open.target = '_blank'; open.rel = 'noopener';
                    acts.append(open, hideButton(pg));
                    row.append(pic, info, acts);
                    list.append(row);
                }
            };
            search.addEventListener('input', draw);
            draw();
        }

        async function renderAdmin() {
            const view = $('#adminView');
            view.innerHTML = '';
            const allBox = el('div', 'glass reports');
            const box = el('div', 'glass reports');
            box.append(el('div', 'sec', 'Reported pages'));
            view.append(allBox, box);
            renderAllPages(allBox);
            const { data: reports, error } = await sb.from('reports').select('*').order('created_at', { ascending: false }).limit(200);
            if (error) return box.append(el('p', 'quiet err', friendlyError(error)));
            if (!reports.length) return box.append(el('p', 'quiet', 'No reports. Everyone\'s being lovely. 💕'));
            const ids = [...new Set(reports.map(r => r.page_id))];
            const { data: pgs } = await sb.from('pages').select('id,slug,hidden,headline,sender_name').in('id', ids);
            const byId = Object.fromEntries((pgs || []).map(p => [p.id, p]));
            for (const r of reports) {
                const pg = byId[r.page_id];
                const card = el('div', 'report' + (r.resolved ? ' resolved' : ''));
                const head = el('div', 'r-head');
                const a = el('a', null, pg ? '/p/' + pg.slug : '(deleted page)');
                if (pg) { a.href = pageLink(pg.slug); a.target = '_blank'; a.rel = 'noopener'; }
                head.append(a, el('span', 'pill', new Date(r.created_at).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })));
                if (pg?.hidden) head.append(el('span', 'pill hidden-pill', 'Hidden'));
                if (r.resolved) head.append(el('span', 'pill', 'Resolved'));
                const acts = el('div', 'acts');
                if (pg) acts.append(hideButton(pg));
                if (!r.resolved) {
                    const done = el('button', 'btn btn-glass btn-small', 'Mark resolved');
                    done.type = 'button';
                    done.addEventListener('click', async () => {
                        const { error } = await sb.from('reports').update({ resolved: true }).eq('id', r.id);
                        if (error) return toast(friendlyError(error));
                        renderAdmin();
                    });
                    acts.append(done);
                }
                card.append(head, el('p', null, r.reason), acts);
                box.append(card);
            }
        }

        load();
    })();
    </script>
</body>
</html>
