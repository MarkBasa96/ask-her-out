<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset=".55" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".78" r=".55">
      <stop offset="0" stop-color="#ff6a50" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#06060b"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <circle cx="12" cy="12" r="1.2" fill="#fff" opacity=".8"/>
    <circle cx="52" cy="10" r="1" fill="#ffe0d0" opacity=".7"/>
    <circle cx="55" cy="26" r=".9" fill="#fff" opacity=".55"/>
    <circle cx="8" cy="30" r=".8" fill="#fff" opacity=".5"/>
    <!-- the rising sun's rim, like the arc on the page -->
    <circle cx="32" cy="80" r="36" fill="#06060b" stroke="url(#sun)" stroke-width="3.2"/>
    <path d="M-4 80a36 36 0 0 1 72 0" fill="none" stroke="#ffdcb4" stroke-width="1" opacity=".9"/>
    <!-- a heart rising out of it -->
    <path d="M32 40.5c-7.6-5.1-12-9.3-12-14.4 0-3.6 2.8-6.3 6.2-6.3 2.5 0 4.6 1.4 5.8 3.5 1.2-2.1 3.3-3.5 5.8-3.5 3.4 0 6.2 2.7 6.2 6.3 0 5.1-4.4 9.3-12 14.4z" fill="url(#sun)"/>
    <path d="M24.6 24.4c.8-1.3 2.1-2 3.5-2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
